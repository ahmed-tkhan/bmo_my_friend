[package]
name = "bmo-firmware"
version = "1.0.0"
authors = ["BMO Team"]
edition = "2021"
resolver = "2"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols

[profile.dev]
debug = true
opt-level = "s"

[dependencies]
# ESP32-C3 HAL
esp-idf-hal = "0.43"
esp-idf-sys = { version = "0.34", features = ["binstart"] }

# Embedded abstractions
embedded-hal = "0.2"
embedded-graphics = "0.8"

# Data structures for no_std
heapless = "0.8"

# Modbus protocol
modbus-core = "0.5"

# Logging
log = "0.4"
esp-idf-svc = "0.48"

# Async runtime (optional)
embassy-executor = { version = "0.5", optional = true }
embassy-time = { version = "0.3", optional = true }

# Utilities
critical-section = "1.1"
once_cell = { version = "1.19", default-features = false }

[features]
default = ["std"]
std = ["esp-idf-hal/std", "esp-idf-sys/std"]
async = ["embassy-executor", "embassy-time"]

[build-dependencies]
embuild = "0.31"

[[bin]]
name = "bmo-firmware"
path = "src/main.rs"
